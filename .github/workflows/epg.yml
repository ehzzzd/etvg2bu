name: Generate EPG (XMLTV)

on:
  schedule:
    # every 6 hours (UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate guide.xml
        env:
          PROVIDER: ${{ secrets.PROVIDER || 'X341764498' }}
          REGION: ${{ secrets.REGION || '901' }}
          DAYS: "3"
          TZ_NAME: America/Puerto_Rico      # salida: hora local del espectador
          SITE_TZ: America/Puerto_Rico       # region 901 ya viene en hora local de PR (AST)
        run: python epg.py --output guide.xml --channels-output channels.xml

      - name: Compress guide
        run: gzip -kf guide.xml

      - name: Validate output
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET
          root = ET.parse('guide.xml').getroot()
          progs = root.findall('programme')
          print(f"OK: {len(root.findall('channel'))} channels, {len(progs)} programmes")
          assert len(progs) > 100, "too few programmes - refusing to publish"
          EOF

      - name: Commit updated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add guide.xml guide.xml.gz channels.xml
          git diff --cached --quiet || git commit -m "chore: update EPG guide [skip ci]"
          git push
